services:
  mongodb:
    image: mongo:7
    container_name: patient-forms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    container_name: patient-forms-backend
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      MONGO_URI: mongodb://mongodb:27017/patient-forms
      JWT_SECRET: change-this-secret
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./client
    container_name: patient-forms-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data:

