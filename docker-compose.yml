services:
  mongodb:
    image: mongo:7
    container_name: patient-forms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: patient-forms-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/team-a
      JWT_SECRET: change-this-secret
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:

